<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" fill="none">
  <!-- Desk surface -->
  <rect x="10" y="88" width="140" height="4" rx="1" fill="#1a1a1a"/>
  <rect x="10" y="86" width="140" height="2" fill="#292929"/>

  <!-- Monitor stand -->
  <rect x="72" y="84" width="16" height="6" rx="1" fill="#1a1a1a"/>
  <rect x="66" y="89" width="28" height="3" rx="1.5" fill="#1a1a1a"/>

  <!-- Monitor body -->
  <rect x="24" y="28" width="112" height="58" rx="4" fill="#1a1a1a" stroke="#292929" stroke-width="1"/>

  <!-- Screen -->
  <rect x="29" y="33" width="102" height="48" rx="2" fill="#0d0d0d"/>

  <!-- Code lines on screen -->
  <rect x="35" y="39" width="28" height="3" rx="1" fill="#35d16c" opacity="0.7"/>
  <rect x="35" y="46" width="42" height="2.5" rx="1" fill="#6f6f71" opacity="0.5"/>
  <rect x="41" y="52" width="36" height="2.5" rx="1" fill="#909092" opacity="0.4"/>
  <rect x="41" y="58" width="24" height="2.5" rx="1" fill="#35d16c" opacity="0.5"/>
  <rect x="35" y="64" width="50" height="2.5" rx="1" fill="#6f6f71" opacity="0.3"/>
  <rect x="35" y="70" width="18" height="2.5" rx="1" fill="#909092" opacity="0.35"/>

  <!-- Terminal cursor blink -->
  <rect x="57" y="70" width="2" height="3" fill="#35d16c" opacity="0.8"/>

  <!-- Monitor power LED -->
  <circle cx="80" cy="83" r="1" fill="#35d16c" opacity="0.6"/>

  <!-- Keyboard -->
  <rect x="38" y="94" width="84" height="14" rx="2" fill="#1a1a1a" stroke="#292929" stroke-width="0.5"/>

  <!-- Keyboard keys row 1 -->
  <rect x="42" y="97" width="5" height="3" rx="0.5" fill="#292929"/>
  <rect x="48" y="97" width="5" height="3" rx="0.5" fill="#292929"/>
  <rect x="54" y="97" width="5" height="3" rx="0.5" fill="#292929"/>
  <rect x="60" y="97" width="5" height="3" rx="0.5" fill="#292929"/>
  <rect x="66" y="97" width="5" height="3" rx="0.5" fill="#292929"/>
  <rect x="72" y="97" width="5" height="3" rx="0.5" fill="#292929"/>
  <rect x="78" y="97" width="5" height="3" rx="0.5" fill="#292929"/>
  <rect x="84" y="97" width="5" height="3" rx="0.5" fill="#292929"/>
  <rect x="90" y="97" width="5" height="3" rx="0.5" fill="#292929"/>
  <rect x="96" y="97" width="5" height="3" rx="0.5" fill="#292929"/>
  <rect x="102" y="97" width="5" height="3" rx="0.5" fill="#292929"/>
  <rect x="108" y="97" width="5" height="3" rx="0.5" fill="#292929"/>

  <!-- Keyboard keys row 2 -->
  <rect x="44" y="101" width="5" height="3" rx="0.5" fill="#292929"/>
  <rect x="50" y="101" width="5" height="3" rx="0.5" fill="#292929"/>
  <rect x="56" y="101" width="5" height="3" rx="0.5" fill="#292929"/>
  <rect x="62" y="101" width="5" height="3" rx="0.5" fill="#292929"/>
  <rect x="68" y="101" width="5" height="3" rx="0.5" fill="#292929"/>
  <rect x="74" y="101" width="5" height="3" rx="0.5" fill="#292929"/>
  <rect x="80" y="101" width="5" height="3" rx="0.5" fill="#292929"/>
  <rect x="86" y="101" width="5" height="3" rx="0.5" fill="#292929"/>
  <rect x="92" y="101" width="5" height="3" rx="0.5" fill="#292929"/>
  <rect x="98" y="101" width="5" height="3" rx="0.5" fill="#292929"/>
  <rect x="104" y="101" width="5" height="3" rx="0.5" fill="#292929"/>

  <!-- Spacebar -->
  <rect x="56" y="105" width="48" height="2.5" rx="0.5" fill="#292929"/>

  <!-- Coffee cup -->
  <rect x="132" y="78" width="10" height="10" rx="1" fill="#1a1a1a" stroke="#292929" stroke-width="0.5"/>
  <path d="M142 81 Q146 81 146 85 Q146 88 142 88" stroke="#292929" stroke-width="0.7" fill="none"/>
  <!-- Steam -->
  <path d="M135 76 Q136 73 135 70" stroke="#6f6f71" stroke-width="0.5" fill="none" opacity="0.4"/>
  <path d="M138 77 Q139 74 138 71" stroke="#6f6f71" stroke-width="0.5" fill="none" opacity="0.3"/>
</svg>
